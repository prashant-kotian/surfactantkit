[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surfactantkit"
version = "0.1.0"
description = "Mixed-surfactant micellization theory (Clint, Rubingh, Gibbs adsorption) as a tested Python library and MCP server, so AI assistants stop hallucinating CMC and interaction-parameter values."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prashant D. Kotian" }]
keywords = ["surfactant", "micelle", "CMC", "Rubingh", "Clint", "colloid", "interfacial-science", "MCP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
